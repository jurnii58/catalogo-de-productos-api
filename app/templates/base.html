<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Catálogo{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #64748b;
      --brand: #4f46e5;
      --brand-dark: #4338ca;
      --line: #e5e9f2;
      --surface: #ffffff;
      --canvas: #f5f7fb;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(99, 102, 241, .10), transparent 34rem),
        var(--canvas);
      color: var(--ink);
    }

    main.container {
      max-width: 1180px;
      padding-top: 1.25rem;
      padding-bottom: 4rem;
    }

    nav {
      margin-bottom: 3rem;
      padding: .6rem 1rem;
      border: 1px solid rgba(229, 233, 242, .85);
      border-radius: 1rem;
      background: rgba(255, 255, 255, .85);
      box-shadow: 0 8px 24px rgba(23, 32, 51, .04);
    }

    nav strong {
      color: var(--ink);
      font-size: 1.15rem;
      letter-spacing: -.03em;
    }

    nav a {
      color: #475569;
      font-weight: 600;
      text-decoration: none;
    }

    nav a:hover {
      color: var(--brand);
    }

    h1, h2, h3 {
      color: var(--ink);
      letter-spacing: -.04em;
    }

    .catalog-hero {
      margin: 0 0 2rem;
    }

    .eyebrow {
      margin-bottom: .45rem;
      color: var(--brand);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .catalog-hero h1 {
      margin-bottom: .5rem;
      font-size: clamp(2rem, 5vw, 3.1rem);
    }

    .catalog-hero p:last-child {
      margin-bottom: 0;
      color: var(--muted);
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem 0 1rem;
    }

    .section-heading h2 {
      margin-bottom: 0;
      font-size: 1.4rem;
    }

    .section-heading small,
    .muted {
      color: var(--muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr));
      gap: 1.2rem;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(23, 32, 51, .055);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(23, 32, 51, .10);
    }

    .product-visual {
      display: grid;
      height: 210px;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #eef2ff, #f8fafc 58%, #e0e7ff);
    }

    .product-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      display: grid;
      justify-items: center;
      gap: .55rem;
      color: #818cf8;
      font-size: .85rem;
      font-weight: 600;
    }

    .image-placeholder span:first-child {
      display: grid;
      width: 3.25rem;
      height: 3.25rem;
      place-items: center;
      border: 1px solid #c7d2fe;
      border-radius: 1rem;
      background: rgba(255, 255, 255, .7);
      font-size: 1.5rem;
    }

    .product-details {
      padding: 1rem 1.1rem 1.15rem;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .55rem;
    }

    .product-sku {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .category-chip,
    .stock-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: .22rem .58rem;
      font-size: .72rem;
      font-weight: 700;
    }

    .category-chip {
      background: #eef2ff;
      color: #4338ca;
    }

    .product-card h3 {
      min-height: 2.8rem;
      margin-bottom: .6rem;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .product-price {
      margin: 0 0 .7rem;
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .product-stock {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .45rem;
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: .85rem;
    }

    .stock-chip.available {
      background: #dcfce7;
      color: #166534;
    }

    .stock-chip.unavailable {
      background: #fee2e2;
      color: #991b1b;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .55rem;
      align-items: center;
      padding-top: .9rem;
      border-top: 1px solid var(--line);
    }

    .product-actions form {
      margin: 0;
    }

    .product-actions button,
    .upload-button {
      display: inline-flex;
      width: 100%;
      min-height: 2.55rem;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: .65rem;
      background: #fff;
      color: #334155;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .upload-button:hover,
    .product-actions button:hover {
      border-color: #c7d2fe;
      background: #f5f3ff;
      color: var(--brand-dark);
    }

    .upload-button {
      position: relative;
      overflow: hidden;
    }

    .upload-button input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-note {
      grid-column: 1 / -1;
      margin: -.25rem 0 0;
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
    }

    .empty-state {
      margin: 0;
      padding: 2.3rem 1rem;
      border: 1px dashed #cbd5e1;
      border-radius: 1rem;
      background: rgba(255, 255, 255, .7);
      color: var(--muted);
      text-align: center;
    }

    .form-panel {
      margin-top: 3rem;
      padding: clamp(1.2rem, 3vw, 2rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 12px 32px rgba(23, 32, 51, .055);
    }

    .form-panel h2 {
      margin-bottom: .4rem;
      font-size: 1.45rem;
    }

    .form-panel > p {
      margin-bottom: 1.4rem;
      color: var(--muted);
    }

    .form-panel label {
      color: #334155;
      font-size: .88rem;
      font-weight: 650;
    }

    .form-panel input,
    .form-panel select {
      border-color: #dce2ec;
      border-radius: .65rem;
      background-color: #fbfcfe;
    }

    .form-panel button[type="submit"] {
      width: 100%;
      border: 0;
      border-radius: .7rem;
      background: var(--brand);
      font-weight: 700;
    }

    .form-panel button[type="submit"]:hover {
      background: var(--brand-dark);
    }

    @media (max-width: 600px) {
      main.container {
        padding-top: .5rem;
      }

      nav {
        margin-bottom: 2rem;
        padding-inline: .5rem;
      }

      nav ul:last-child {
        gap: .35rem;
      }

      nav a {
        padding-inline: .35rem;
        font-size: .85rem;
      }

      .product-visual {
        height: 230px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>Tienda</strong></li></ul>
      <ul>
        <li><a href="/web/productos">Catálogo</a></li>
        <li><a href="/web/favoritos">Favoritos</a></li>
        <li><a href="/docs">API</a></li>
      </ul>
    </nav>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
